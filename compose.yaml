services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-linkup}:${POSTGRES_PASSWORD:-linkup}@postgres:5432/${POSTGRES_DB:-linkup}
      REDIS_URL: redis://redis:6379/0
      SQL_ECHO: "false"
      REFRESH_COOKIE_SECURE: "false"
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn linkup.main:app
        --app-dir src
        --host 0.0.0.0
        --port 8000
        --no-access-log
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health")
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linkup}
      POSTGRES_USER: ${POSTGRES_USER:-linkup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkup}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
